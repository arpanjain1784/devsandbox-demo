name: DevSandbox Remote CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # This bypasses your Windows virtualization limits
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests (kubeconform)
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: "-summary -ignore-filename-pattern kustomization.yml k8s/base/"

      - name: Build FastAPI Docker Image
        run: docker build -t demo-app:local .

      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: devsandbox-cluster

      - name: Load Docker Image into KinD Cluster
        run: kind load docker-image demo-app:local --name devsandbox-cluster

      - name: Deploy using Kustomize
        run: |
          # 1. Force K8s to look at the local image we just loaded
          sed -i 's/imagePullPolicy: Always/imagePullPolicy: IfNotPresent/g' k8s/base/deployment.yml
          
          # 2. Deploy the foundational configuration
          kubectl apply -k k8s/base/
          
          # 3. Bulletproof injection: explicitly force the container to use our local tag
          kubectl set image deployment/demo demo=demo-app:local -n demo-ns
          
      - name: Verify Deployment Rollout
        run: |
          kubectl get deployments -A
          kubectl wait --for=condition=available --timeout=60s deployment --all -A
          
      - name: Print Debug Logs on Failure
        if: failure()
        run: |
          echo "DEPLOYMENT FAILED. FETCHING CRASH LOGS:"
          kubectl get pods -A
          kubectl describe pods -n demo-ns